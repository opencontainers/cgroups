# This is deliberately a separate workflow -- so that it still runs when
# another workflow file is broken.
name: actionlint
on:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
  pull_request:

# Cancel superseded runs of the same pull request. For everything else
# (in particular, pushes to a branch or a tag) there is no PR number, so
# the group falls back to the unique run_id and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/actionlint@1a9278318c43b72cdf644214128fb0786d210147 # v1.17
