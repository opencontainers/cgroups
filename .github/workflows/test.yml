name: test
on:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
  pull_request:
  schedule:
    # Runs at 00:00 UTC every Monday
    - cron: '0 0 * * 1'
permissions:
  contents: read

jobs:
  cgroup-v2:
    name: "cgroup v2 (Ubuntu 26.04)"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "" # Use go-version-file (see https://github.com/actions/setup-go/issues/450#issuecomment-3620402646).
          - oldstable
          - stable
        race: ["-race", ""]
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        go-version-file: go.mod # Take version from go.mod when go-version is empty.
    - run: CGROUPS_ALLOW_UNSAFE_TESTS=true go test -timeout 3m ${{ matrix.race }} -v ./...

  cgroup-v1:
    name: "cgroup v1 (AlmaLinux 8)"
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
      id: lima-actions-setup

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/lima
        key: lima-${{ steps.lima-actions-setup.outputs.version }}

    - name: "Start VM"
      # --plain is set to disable file sharing, port forwarding, built-in containerd, etc. for faster start up
      run: limactl start --plain --name=default template://almalinux-8

    - name: "Initialize VM"
      run: |
        set -eux -o pipefail
        limactl cp -r . default:/tmp/cgroups
        lima sudo dnf install -y golang

    - name: "Run unit tests"
      run: LIMA_WORKDIR=/tmp/cgroups lima sudo GOTOOLCHAIN=auto CGROUPS_ALLOW_UNSAFE_TESTS=true go test -v ./...

  all-done:
    needs:
      - cgroup-v2
      - cgroup-v1
    runs-on: ubuntu-26.04
    steps:
    - run: echo "All jobs completed"
